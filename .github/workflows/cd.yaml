name: CD
on:
  pull_request:
    types: [closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-push:
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/deploy'))
    runs-on: ubuntu-latest
    steps:
      - name: Get deploy SHA
        id: sha
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              return pr.data.head.sha;
            }
            return context.sha;
          result-encoding: string

      - name: Add deploy reaction
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.sha.outputs.result }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image for scanning (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          platforms: linux/amd64
          tags: kaiohz/pickpro:raganything-scan

      - name: Trivy Image Scan (report)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: 'kaiohz/pickpro:raganything-scan'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'
          trivy-config: trivy.yaml
          trivy-version: 'v0.69.3'

      - name: Trivy Image Scan (CRITICAL gate)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: 'kaiohz/pickpro:raganything-scan'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'
          trivy-config: trivy.yaml
          trivy-version: 'v0.69.3'

      - name: Build and push Docker image (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            kaiohz/pickpro:raganything-${{ steps.sha.outputs.result }}
            kaiohz/pickpro:raganything-latest
